<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14243a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>帝國爭霸 線上版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
:root{--sea:#14243a;--sea2:#1b3150;--ink:#2b2118;--parch:#f3ead6;--parch2:#e6d8b8;--gold:#d9a93f;--muted:#7c6a50;--red:#b23a2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--sea);color:var(--parch);min-height:100vh}
h1,h2,h3{font-family:"Noto Serif TC",serif;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--gold);color:#2a1d07;font-weight:700;touch-action:manipulation}
button.ghost{background:transparent;color:var(--parch);border:1px solid #ffffff40}
button.danger{background:var(--red);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid #ffffff40;background:#0e1a2b;color:var(--parch);min-width:0}
.hidden{display:none!important}
#app{max-width:1280px;margin:0 auto;padding:12px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
header.top h1{font-size:26px;letter-spacing:2px;color:var(--gold)}
header.top .sub{color:#c8bda3;font-size:13px}
.spacer{flex:1}
.pill{background:#ffffff14;border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap}
.lobby{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:800px){.lobby{grid-template-columns:1fr}}
.panel{background:var(--sea2);border:1px solid #ffffff1c;border-radius:14px;padding:16px}
.panel h2{font-size:19px;margin-bottom:10px;color:var(--gold)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.item{display:flex;align-items:center;gap:8px;background:#ffffff0d;border-radius:8px;padding:8px 10px}
.note{font-size:13px;color:#c8bda3;line-height:1.6}
.err{color:#ff9b8f;font-size:13px;margin-top:6px;min-height:1em}
.code{font-family:ui-monospace,monospace;font-size:22px;letter-spacing:4px;color:var(--gold)}
/* ---- game layout (desktop) ---- */
.gwrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px}
.gmain{display:flex;flex-direction:column;gap:10px;min-width:0}
.mapwrap{position:relative;aspect-ratio:1000/565;background:radial-gradient(ellipse at 50% 45%,#2a5a8c,#173456 70%,#10243d);border-radius:14px;border:1px solid #ffffff1c;overflow:hidden}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.region{cursor:pointer}
.region circle.body{stroke-width:3}
.edge.hl{stroke:#ffe9a3!important;opacity:1!important;stroke-width:3.6!important;stroke-dasharray:none!important;filter:drop-shadow(0 0 3px #ffb300)}
svg.focus .edge:not(.hl){opacity:.18!important}
svg.nolines .edge.land:not(.hl){display:none}
.zoom button.off{opacity:.45}
.region text{pointer-events:none}
.region.sel circle.ring{stroke:#fff;stroke-width:4;opacity:1}
.region.target circle.ring{stroke:#ffe27a;stroke-width:3;opacity:1;stroke-dasharray:6 4;animation:spin 3s linear infinite}
.region.battle circle.ring{stroke:#ff6b5b;stroke-width:5;opacity:1}
@keyframes spin{to{stroke-dashoffset:-40}}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:40px;height:40px;padding:0;border-radius:10px;background:#0b1626cc;color:var(--parch);border:1px solid #ffffff30;font-size:20px;line-height:1}
.legend{position:absolute;left:8px;bottom:6px;display:flex;gap:6px;flex-wrap:wrap;font-size:11px;pointer-events:none}
.legend span{display:flex;align-items:center;gap:4px;background:#0008;padding:2px 7px;border-radius:999px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.side{display:flex;flex-direction:column;gap:12px}
.side .close{display:none}
.seat{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;background:#ffffff0a;font-size:14px}
.seat.turn{outline:2px solid var(--gold);background:#d9a93f1f}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff6}
.seat .meta{margin-left:auto;font-size:12px;color:#c8bda3;text-align:right;line-height:1.35}
.log{max-height:240px;overflow:auto;font-size:13px;line-height:1.55;color:#ddd2b8}
.log div{padding:2px 0;border-bottom:1px dashed #ffffff12}
.bar{background:var(--sea2);border:1px solid #ffffff1c;border-radius:14px;padding:10px 12px}
.pilerow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.deck{position:relative;width:62px;height:84px;border-radius:9px;flex:none;cursor:default;background:repeating-linear-gradient(45deg,#7a2d22 0 6px,#8f3a2c 6px 12px);border:3px solid var(--parch2);box-shadow:3px 3px 0 #5a2018,6px 6px 0 #3e160f;display:grid;place-items:center;color:#fff;font-family:"Noto Serif TC",serif;font-weight:900;font-size:22px;text-shadow:0 2px 3px #000;transition:transform .12s}
.deck small{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-family:"Noto Sans TC";font-size:10px;font-weight:700}
.deck.can{cursor:pointer;animation:glow 1s ease-in-out infinite alternate}
.deck.can:active{transform:scale(.94)}
@keyframes glow{from{box-shadow:3px 3px 0 #5a2018,6px 6px 0 #3e160f,0 0 0 #ffd76a}to{box-shadow:3px 3px 0 #5a2018,6px 6px 0 #3e160f,0 0 18px 4px #ffd76a}}
.pileinfo{font-size:12.5px;color:#c8bda3;line-height:1.5}
.pileinfo b{color:var(--parch);font-size:15px}
.mobonly{display:none}
.status{font-size:14.5px;margin-bottom:6px;line-height:1.5}
.status b{color:var(--gold)}
.hand{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 8px}
.card{flex:none;width:92px;height:126px;border-radius:10px;background:linear-gradient(160deg,var(--parch),var(--parch2));color:var(--ink);position:relative;cursor:pointer;border:3px solid transparent;box-shadow:0 3px 8px #0006;transition:transform .12s;padding:6px;display:flex;flex-direction:column;user-select:none}
.card.sel{border-color:var(--gold);transform:translateY(-6px)}
.card .cv{font-family:"Noto Serif TC",serif;font-weight:900;font-size:32px;line-height:1;margin-top:auto;align-self:flex-end}
.card .cn{font-weight:700;font-size:13.5px;line-height:1.2}
.card .cc{font-size:10.5px;color:#fff;border-radius:5px;padding:1px 5px;align-self:flex-start;margin-top:4px}
.card .tag{position:absolute;left:6px;bottom:6px;font-size:10px;border-radius:5px;padding:1px 4px;font-weight:700;max-width:52px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tag.ok{background:#3bb27333;color:#1e6b42}.tag.star{background:#d9a93f55;color:#6b4a0a}.tag.taken{background:#0002;color:#6b5a48}
.card.new::after{content:"新";position:absolute;right:-6px;top:-6px;background:var(--red);color:#fff;font-size:11px;border-radius:50%;width:20px;height:20px;display:grid;place-items:center}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--parch);color:var(--ink);border-radius:16px;padding:20px;max-width:520px;width:100%;box-shadow:0 10px 40px #000a;max-height:92vh;overflow:auto}
.modal h2{color:var(--ink);margin-bottom:10px}
.modal .note{color:var(--muted)}
.bt{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;margin:10px 0}
.bt .side2{background:#0000000d;border-radius:10px;padding:10px}
.bt .tot{font-family:"Noto Serif TC",serif;font-size:38px;font-weight:900}
.minis{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
.mini{font-size:12px;background:#fff;border-radius:5px;padding:2px 6px;border:1px solid #0002}
.score-row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:#0000000a;margin:5px 0}
.score-row .s{margin-left:auto;font-family:"Noto Serif TC",serif;font-size:24px;font-weight:900}
.rules{font-size:14px;line-height:1.75;color:#ddd2b8}
.rules b{color:var(--gold)}
details summary{cursor:pointer;color:var(--gold);font-weight:700}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--gold);color:#2a1d07;font-weight:700;padding:9px 16px;border-radius:10px;z-index:50;box-shadow:0 6px 18px #0008;max-width:90vw;text-align:center}
.drawfx{position:fixed;z-index:45;pointer-events:none;width:92px;height:126px;border-radius:10px;background:linear-gradient(160deg,var(--parch),var(--parch2));color:var(--ink);display:grid;place-items:center;font-weight:700;box-shadow:0 8px 24px #000a;animation:dfx .9s ease forwards;text-align:center;font-size:14px}
@keyframes dfx{0%{transform:scale(.4) rotateY(90deg);opacity:0}25%{transform:scale(1.15) rotateY(0);opacity:1}75%{opacity:1}100%{transform:translateY(60px) scale(.8);opacity:0}}

/* ---- phone: full-screen game ---- */
@media (max-width:820px), (max-height:520px){
  body.ingame{overflow:hidden}
  body.ingame #app{padding:0;max-width:none}
  body.ingame header.top{display:none}
  .gwrap{display:block}
  .gmain{position:fixed;inset:0;gap:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);background:var(--sea)}
  .mapwrap{aspect-ratio:auto;flex:1;min-height:0;border-radius:0;border:0}
  .bar{flex:none;max-height:50vh;max-height:50dvh;overflow:auto;border-radius:14px 14px 0 0;border-width:1px 0 0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px #0009}
  .side{display:none}
  body.showside .side{display:flex;position:fixed;inset:0;z-index:30;background:var(--sea);overflow:auto;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
  body.showside .side .close{display:block}
  .mobonly{display:inline-block}
  .deck{width:48px;height:64px;font-size:18px;box-shadow:2px 2px 0 #5a2018,4px 4px 0 #3e160f}
  .pilerow{margin-bottom:4px;gap:8px}
  .pilerow button{padding:7px 10px;font-size:13px;white-space:nowrap}
  .status{font-size:13px;margin-bottom:2px}
  .hand{gap:6px;padding:7px 2px 6px}
  .card{width:66px;height:92px;padding:4px;border-width:2px}
  .card .cn{font-size:11.5px}.card .cc{font-size:9.5px;padding:0 4px}.card .cv{font-size:22px}.card .tag{font-size:9px;max-width:40px;left:4px;bottom:4px}
  .card.sel{transform:translateY(-4px)}
  .actions button{padding:8px 10px;font-size:13.5px;flex:1 1 auto}
  .legend{display:none}
  .zoom button{width:38px;height:38px}
}
@media (max-height:520px) and (orientation:landscape){
  .gmain{flex-direction:row}
  .bar{width:310px;max-height:none;height:100%;border-radius:0;border-width:0 0 0 1px;box-shadow:-6px 0 18px #0009;padding-bottom:8px}
  .hand{flex-wrap:wrap;overflow:visible}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>帝國爭霸</h1>
    <span class="sub">IMPERA 區域控制紙牌遊戲・線上版</span>
    <span class="spacer"></span>
    <span id="hdrInfo" class="pill hidden"></span>
    <button id="btnLeave" class="ghost hidden">回大廳</button>
  </header>

  <section id="lobby">
    <div class="lobby">
      <div class="panel">
        <h2>開始遊戲</h2>
        <div class="row"><label>暱稱</label><input id="nick" maxlength="12" placeholder="輸入你的名字" style="flex:1"></div>
        <div id="onlineBox">
          <div class="row"><button id="btnCreate">建立線上房間</button></div>
          <div class="row"><input id="joinCode" maxlength="4" placeholder="房號" autocapitalize="characters" style="width:110px;text-transform:uppercase"><button id="btnJoin" class="ghost">加入房間</button></div>
          <div id="rejoin" class="row hidden"></div>
        </div>
        <div id="offlineNote" class="note hidden"></div>
        <div class="row" style="margin-top:14px">
          <button id="btnSolo" class="ghost">單機練習：與電腦對戰</button>
          <select id="soloBots">
            <option value="1">1 位電腦</option><option value="2" selected>2 位電腦</option><option value="3">3 位電腦</option><option value="4">4 位電腦</option>
          </select>
        </div>
        <div class="err" id="lobbyErr"></div>
        <h2 style="margin-top:14px">等待中的房間</h2>
        <div id="openRooms" class="list"><div class="note">載入中…</div></div>
      </div>
      <div class="panel">
        <h2>規則速覽</h2>
        <div class="rules" id="rulesText"></div>
      </div>
    </div>
  </section>

  <section id="room" class="hidden">
    <div class="panel" style="max-width:620px;margin:0 auto">
      <h2>房間 <span class="code" id="roomCode"></span></h2>
      <div class="note">把房號（或這個網址）傳給朋友就能加入。最多 5 個座位（玩家＋電腦）。</div>
      <div class="row"><button class="ghost" id="btnCopy">複製邀請連結</button></div>
      <div id="roomPlayers" class="list" style="margin-top:10px"></div>
      <div id="hostCtrls" class="row hidden" style="margin-top:12px">
        <span>電腦玩家：</span>
        <button class="ghost" id="botMinus">－</button><span id="botCount" class="pill">0</span><button class="ghost" id="botPlus">＋</button>
        <span class="spacer"></span>
        <button id="btnStart">開始遊戲</button>
      </div>
      <div id="guestWait" class="note hidden" style="margin-top:12px">等待房主開始遊戲…</div>
      <div class="err" id="roomErr"></div>
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="gwrap">
      <div class="gmain">
        <div class="mapwrap" id="mapwrap">
          <svg id="map" viewBox="0 0 1000 565"></svg>
          <div class="zoom"><button id="zIn" aria-label="放大">＋</button><button id="zOut" aria-label="縮小">－</button><button id="zFit" aria-label="全圖" style="font-size:15px">全</button><button id="zLines" aria-label="顯示攻擊線" style="font-size:15px">線</button></div>
          <div class="legend" id="legend"></div>
        </div>
        <div class="bar">
          <div class="pilerow">
            <div class="deck" id="deck"><span id="deckN">0</span><small id="deckHint">牌庫</small></div>
            <div class="pileinfo" id="pileinfo"></div>
            <span class="spacer"></span>
            <button class="ghost mobonly" id="btnSide">📜 戰況</button>
            <button class="ghost mobonly" id="btnLeave2">離開</button>
          </div>
          <div class="status" id="status"></div>
          <div class="hand" id="hand"></div>
          <div class="actions" id="actions"></div>
        </div>
      </div>
      <div class="side">
        <button class="close ghost" id="btnSideClose">✕ 回到地圖</button>
        <div class="panel" style="padding:12px"><h2 style="font-size:17px">玩家</h2><div id="seats" class="list"></div></div>
        <div class="panel" style="padding:12px"><h2 style="font-size:17px">戰報</h2><div id="log" class="log"></div></div>
        <div class="panel" style="padding:12px"><details><summary>規則</summary><div class="rules" id="rulesText2" style="margin-top:8px"></div></details></div>
      </div>
    </div>
  </section>
</div>
<div id="overlay" class="overlay hidden"><div class="modal" id="modal"></div></div>

<script>
/* ===== 線上伺服器設定（Supabase）===== */
const SB_URL = 'https://ntxzcawcrffxzzecaiat.supabase.co';
const SB_KEY = 'sb_publishable_iH44mhK6lMth7fPAnQUCpA_lJRedlBq';
/* ================= ENGINE START ================= */
/* ================= ENGINE START ================= */
const CONT = {
  na:{name:'北美洲',color:'#2f9aa0'}, sa:{name:'南美洲',color:'#62b84c'}, eu:{name:'歐洲',color:'#7b5ea8'},
  af:{name:'非洲',color:'#d9a63a'}, as:{name:'亞洲',color:'#d4473f'}, oc:{name:'大洋洲',color:'#e8843a'}
};
// [id, 名稱, 戰力, 洲, 經度, 緯度] → 以麥卡托投影換算到 1000×565 的地圖座標
const MAP_W=1000, MAP_H=565, MERC_S=1000/(2*Math.PI), MERC_Y=Math.log(Math.tan(Math.PI/4+78*Math.PI/360));
function mercXY(lon,lat){ return [((lon+170)%360+360)%360/360*1000, (MERC_Y-Math.log(Math.tan(Math.PI/4+lat*Math.PI/360)))*MERC_S]; }
const REGIONS = [
  ['alaska','阿拉斯加',5,'na',-150,64],['arctic','北美極地',4,'na',-108,66],['greenland','格陵蘭',1,'na',-42,73],
  ['quebec','魁北克',2,'na',-72,53],['amfed','美國聯邦',6,'na',-100,40],['central','中美洲',3,'na',-96,19],
  ['venez','委內瑞拉',3,'sa',-70,8],['amaz','亞馬遜',4,'sa',-53,-7],['andes','安第斯山脈',6,'sa',-72,-16],['pampas','彭巴草原',1,'sa',-64,-36],
  ['kotn','英國',2,'eu',-6,57],['scan','斯堪地那維亞',4,'eu',16,64],['weu','西歐',6,'eu',3,45],['eeu','東歐',3,'eu',26,48],['erus','歐洲俄羅斯',5,'eu',44,57],
  ['magh','馬格里布',6,'af',2,28],['atl','西非',5,'af',-7,11],['cafr','中非',1,'af',20,0],['eafr','東非',3,'af',38,10],['safr','南非',2,'af',25,-26],
  ['meast','中東',4,'as',47,29],['nasia','北亞',5,'as',100,63],['mongol','蒙古帝國',6,'as',103,38],['japan','日本',3,'as',139,37],
  ['india','印度',2,'as',78,21],['indo','印度支那',1,'as',103,15],
  ['malay','馬來群島',1,'oc',112,0],['ng','新幾內亞',4,'oc',143,-6],['aus','澳洲',5,'oc',134,-25],['nz','紐西蘭',2,'oc',172,-41]
].map(([id,name,v,c,lon,lat])=>{const [x,y]=mercXY(lon,lat);return {id,name,v,c,lon,lat,x:Math.round(x),y:Math.round(y)};});
const R = Object.fromEntries(REGIONS.map(r=>[r.id,r]));
const EDGES = [
 ['alaska','arctic'],['alaska','nasia',1],['arctic','quebec'],['arctic','amfed'],['quebec','amfed'],['quebec','greenland'],
 ['amfed','central'],['central','venez'],['greenland','kotn'],
 ['venez','amaz'],['venez','andes'],['amaz','andes'],['amaz','pampas'],['andes','pampas'],['amaz','atl'],
 ['kotn','weu'],['scan','weu'],['scan','eeu'],['scan','erus'],['weu','eeu'],['weu','magh'],['eeu','erus'],['eeu','meast'],['eeu','eafr'],
 ['erus','meast'],['erus','nasia'],
 ['magh','atl'],['magh','cafr'],['magh','eafr'],['atl','cafr'],['cafr','eafr'],['cafr','safr'],['eafr','safr'],['eafr','meast'],
 ['meast','india'],['meast','mongol'],['nasia','mongol'],['nasia','japan'],['mongol','japan'],['mongol','india'],['mongol','indo'],
 ['india','indo'],['indo','malay'],['malay','ng'],['malay','aus'],['ng','aus'],['aus','nz']
];
const ADJ = {}; REGIONS.forEach(r=>ADJ[r.id]=new Set());
EDGES.forEach(([a,b])=>{ADJ[a].add(b);ADJ[b].add(a);});
const SEAT_COLORS=['#e63946','#1d5fd8','#14a34a','#f5c518','#2b2b2b'];
const DARK_TEXT=new Set(['#f5c518']);
const BOT_NAMES=['拿破崙','凱撒','成吉思汗','亞歷山大','伊莉莎白'];

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function clone(o){return JSON.parse(JSON.stringify(o));}
function nm(id){return R[id].name;}
function addLog(s,msg){s.log.push(msg); if(s.log.length>60) s.log=s.log.slice(-60);}
function seatName(s,i){return s.seats[i].name;}

function newGame(seats){
  let deck=shuffle(REGIONS.flatMap(r=>[r.id,r.id,r.id]));
  const hands={};
  seats.forEach((_,i)=>{hands[i]=deck.splice(0,5);});
  const s={status:'playing',seats,deck,discard:[],reshuffles:0,maxReshuffles:seats.length<=3?1:0,
    hands,owned:{},turn:Math.floor(Math.random()*seats.length),phase:'draw',pending:0,refill:null,battle:null,lastBattle:null,
    log:[],ending:false,result:null,newCard:null,startedAt:Date.now()};
  addLog(s,`遊戲開始！由 ${seatName(s,s.turn)} 先手。`);
  return s;
}
function drawN(s,seat,n){
  const got=[];
  for(let i=0;i<n;i++){
    if(s.deck.length===0){ s.ending=true; break; }
    const c=s.deck.pop(); s.hands[seat].push(c); got.push(c);
    if(s.deck.length===0){
      if(s.reshuffles<s.maxReshuffles && s.discard.length){
        s.deck=shuffle(s.discard); s.discard=[]; s.reshuffles++;
        addLog(s,'牌庫抽完，棄牌堆洗回成為新牌庫（最後一輪！）');
      } else { s.ending=true; }
    }
  }
  return got;
}
function endTurn(s){
  if(s.ending){finish(s);return;}
  s.turn=(s.turn+1)%s.seats.length; s.phase='draw'; s.pending=0; s.refill=null;
}
function components(s,seat){
  const mine=Object.keys(s.owned).filter(k=>s.owned[k]===seat), seen=new Set(), comps=[];
  for(const st of mine){ if(seen.has(st)) continue;
    const comp=[],q=[st]; seen.add(st);
    while(q.length){const x=q.pop();comp.push(x);for(const y of ADJ[x]) if(!seen.has(y)&&s.owned[y]===seat){seen.add(y);q.push(y);}}
    comps.push(comp);}
  return comps;
}
function scoreOf(s,seat){
  const hand=s.hands[seat]||[]; let best={score:0,comp:[],bonus:0};
  for(const comp of components(s,seat)){
    const set=new Set(comp), bonus=hand.filter(c=>set.has(c)).length, sc=comp.length+bonus;
    if(sc>best.score) best={score:sc,comp,bonus};
  }
  return best;
}
function finish(s){
  s.status='ended'; s.phase='ended'; s.battle=null; s.refill=null; s.pending=0;
  const scores=s.seats.map((_,i)=>({seat:i,...scoreOf(s,i)}));
  const top=Math.max(...scores.map(x=>x.score));
  s.result={scores,winners:scores.filter(x=>x.score===top).map(x=>x.seat)};
  addLog(s,`牌庫耗盡，遊戲結束！勝利者：${s.result.winners.map(i=>seatName(s,i)).join('、')}（${top} 分）`);
}
function takeCards(hand,idxs){
  const sorted=[...new Set(idxs)].sort((a,b)=>b-a), out=[];
  for(const i of sorted){ if(i<0||i>=hand.length) throw new Error('卡片不存在'); out.push(hand.splice(i,1)[0]); }
  return out;
}
function tapLeft(s,seat){
  if(s.status!=='playing') return 0;
  if(s.phase==='draw') return s.turn===seat?1:0;
  if(s.phase==='draw2') return s.turn===seat?s.pending:0;
  if(s.phase==='refill'){ const r=s.refill.find(r=>r.seat===seat); return r?r.n:0; }
  return 0;
}
function actTap(s,seat){
  if(!tapLeft(s,seat)) throw new Error('現在不能抽牌');
  const got=drawN(s,seat,1);
  s.newCard={seat,ids:got,at:Date.now()};
  if(s.phase==='draw'){ s.phase='action'; }
  else if(s.phase==='draw2'){
    s.pending--;
    if(s.pending<=0||s.ending){ addLog(s,`${seatName(s,seat)} 選擇抽 2 張牌。`); endTurn(s); return; }
  } else {
    const r=s.refill.find(r=>r.seat===seat); r.n--;
    addLog(s,`${seatName(s,seat)} 搶到 1 張補牌`);
    if(s.ending){ finish(s); return; }
    if(s.refill.every(r=>r.n<=0)){ endTurn(s); return; }
  }
  if(s.ending) finish(s);
}
function actDraw2(s,seat){
  if(s.status!=='playing'||s.phase!=='action'||s.turn!==seat) throw new Error('現在不是你的回合');
  s.phase='draw2'; s.pending=2;
}
function actPlay(s,seat,idx){
  if(s.status!=='playing'||s.phase!=='action'||s.turn!==seat) throw new Error('現在不是你的回合');
  const id=s.hands[seat][idx]; if(!id) throw new Error('卡片不存在');
  if(s.owned[id]!==undefined) throw new Error('這個地區已經有人佔領了');
  s.hands[seat].splice(idx,1); s.owned[id]=seat;
  addLog(s,`${seatName(s,seat)} 佔領了 ${nm(id)}（${R[id].v}）。`);
  endTurn(s);
}
function actAttack(s,seat,from,to,idxs){
  if(s.status!=='playing'||s.phase!=='action'||s.turn!==seat) throw new Error('現在不是你的回合');
  if(s.owned[from]!==seat) throw new Error('出發地區必須是你的');
  if(s.owned[to]===undefined||s.owned[to]===seat) throw new Error('目標必須是對手的地區');
  if(!ADJ[from].has(to)) throw new Error('兩個地區不相鄰');
  const cards=takeCards(s.hands[seat],idxs);
  s.battle={attacker:seat,defender:s.owned[to],from,to,atkCards:cards};
  s.phase='defend';
  addLog(s,`⚔️ ${seatName(s,seat)} 從 ${nm(from)} 進攻 ${seatName(s,s.owned[to])} 的 ${nm(to)}，投入 ${cards.length} 張暗牌！`);
}
function actDefend(s,seat,idxs){
  const b=s.battle; if(!b||s.phase!=='defend'||b.defender!==seat) throw new Error('現在不需要你防守');
  const dc=takeCards(s.hands[seat],idxs);
  const sum=a=>a.reduce((t,c)=>t+R[c].v,0);
  const atk=R[b.from].v+sum(b.atkCards), def=R[b.to].v+sum(dc), win=atk>def;
  if(win) s.owned[b.to]=b.attacker;
  s.discard.push(...b.atkCards,...dc);
  const an=Math.min(b.atkCards.length,2), dn=Math.min(dc.length,3);
  s.lastBattle={id:(s.lastBattle?.id||0)+1,...b,defCards:dc,atk,def,win,atkDraw:an,defDraw:dn};
  addLog(s,`${win?'🏴 進攻成功':'🛡️ 防守成功'}：${nm(b.from)} ${atk} 對 ${nm(b.to)} ${def}。${win?`${seatName(s,b.attacker)} 奪下 ${nm(b.to)}！`:''}`);
  s.battle=null; s.turn=b.attacker;
  s.refill=[{seat:b.attacker,n:an},{seat:b.defender,n:dn}];
  if(an+dn===0){ endTurn(s); return; }
  s.phase='refill';
  addLog(s,`補牌時間：${seatName(s,b.attacker)} 可抽 ${an} 張、${seatName(s,b.defender)} 可抽 ${dn} 張，搶牌開始！`);
}
function waitingOn(s){
  if(s.status!=='playing') return [];
  if(s.phase==='defend') return [s.battle.defender];
  if(s.phase==='refill') return s.refill.filter(r=>r.n>0).map(r=>r.seat);
  return [s.turn];
}

/* ---- AI ---- */
function bestCompSet(s,seat){return new Set(scoreOf(s,seat).comp);}
function botAction(s,seat){
  const hand=s.hands[seat], best=bestCompSet(s,seat);
  const mine=Object.keys(s.owned).filter(k=>s.owned[k]===seat);
  const dup=id=>hand.filter(c=>c===id).length;
  const playIdx=hand.map((c,i)=>[c,i]).filter(([c])=>s.owned[c]===undefined);
  const anchor=best.size?best:new Set(mine);
  let adjPlays=playIdx.filter(([c])=>[...ADJ[c]].some(n=>anchor.has(n)));
  if(adjPlays.length){
    adjPlays.sort((a,b)=>(dup(b[0])-dup(a[0]))||(R[b[0]].v-R[a[0]].v));
    return {type:'play',idx:adjPlays[0][1]};
  }
  let bestAtk=null;
  for(const f of anchor){ for(const t of ADJ[f]){
    const o=s.owned[t]; if(o===undefined||o===seat) continue;
    const need=R[t].v+Math.min(s.hands[o].length,2)*3.2;
    const usable=hand.map((c,i)=>[c,i]).filter(([c])=>!best.has(c)&&c!==t).sort((a,b)=>R[b[0]].v-R[a[0]].v);
    let sum=R[f].v, pick=[];
    for(const [c,i] of usable){ if(sum>need+0.5||pick.length>=4) break; sum+=R[c].v; pick.push(i); }
    if(sum>need+0.5){
      const val=(1+dup(t))*3 - pick.length + (sum-need)*0.2;
      if(!bestAtk||val>bestAtk.val) bestAtk={type:'attack',from:f,to:t,idxs:pick,val};
    }
  }}
  if(bestAtk && (hand.length>=3 || Math.random()<0.5)) return bestAtk;
  if(playIdx.length && (mine.length===0 || hand.length>=7 || Math.random()<0.35)){
    playIdx.sort((a,b)=>(dup(b[0])-dup(a[0]))||(ADJ[b[0]].size-ADJ[a[0]].size));
    return {type:'play',idx:playIdx[0][1]};
  }
  if(s.deck.length<=2 && playIdx.length) return {type:'play',idx:playIdx[0][1]};
  return {type:'draw'};
}
function botDefense(s,seat){
  const b=s.battle, hand=s.hands[seat], best=bestCompSet(s,seat);
  const important=best.has(b.to)||components(s,seat).length<=1;
  const need=R[b.from].v+b.atkCards.length*3.4-R[b.to].v;
  if(need<0) return [];
  const usable=hand.map((c,i)=>[c,i]).filter(([c])=>!best.has(c)).sort((a,b)=>R[b[0]].v-R[a[0]].v);
  let sum=0,pick=[];
  for(const [c,i] of usable){ if(sum>need||pick.length>=(important?4:3)) break; sum+=R[c].v; pick.push(i); }
  if(sum<=need-1.5 && !important) return [];
  return pick;
}
function botActor(s){
  if(s.status!=='playing') return -1;
  for(const seat of waitingOn(s)) if(s.seats[seat].bot) return seat;
  return -1;
}
function runBot(s,seat){
  if(s.phase==='defend') actDefend(s,seat,botDefense(s,seat));
  else if(s.phase==='draw'||s.phase==='draw2'||s.phase==='refill') actTap(s,seat);
  else { const a=botAction(s,seat);
    if(a.type==='play') actPlay(s,seat,a.idx);
    else if(a.type==='attack') actAttack(s,seat,a.from,a.to,a.idxs);
    else actDraw2(s,seat); }
}

async function loadRooms(){

async function createRoom(){

  if(!$('nick').value.trim()){ $('lobbyErr').textContent='先輸入暱稱'; $('nick').focus(); return; }
  store.set('impera_nick',myName());

    const st={status:'lobby',code:c,host:PID,hostName:myName(),bots:0,createdAt:Date.now()};
    const {data,error}=await sb.rpc('impera_create',{p_code:c,p_state:st});

async function fetchGame(c){

}
async function enterRoom(c){
  c=(c||'').toUpperCase().trim(); if(!/^[A-Z]{4}$/.test(c)){$('lobbyErr').textContent='請輸入 4 個英文字母的房號';return;}

function applyRow(row){

}
async function refetch(){ if(!code||offline) return; try{ applyRow(await fetchGame(code)); }catch(e){} }

    .on('postgres_changes',{event:'*',schema:'public',table:'impera_games',filter:'code=eq.'+code},p=>{ if(p.new&&p.new.state) applyRow(p.new); })
    .on('postgres_changes',{event:'*',schema:'public',table:'impera_players',filter:'code=eq.'+code},()=>loadPlayers())
    .subscribe();
  pollTimer=setInterval(()=>{ refetch(); if(G&&G.status==='lobby') loadPlayers(); },4000);

/* ---- commit (compare-and-swap) ---- */
async function commit(ns){
  const {ver,...st}=ns; const base=G?G.ver:0;
  const state=clone(st);
  if(offline){ G={...state,ver:base+1}; onState(); return true; }
  const {data,error}=await sb.rpc('impera_move',{p_code:code,p_ver:base,p_state:state});
  if(error){ toast('連線錯誤：'+error.message); return false; }
  if(data>0){ if(!G||data>G.ver){ G={...state,ver:data}; onState(); } return true; }
  return false;
}
function mySeat(){ if(!G||!G.seats) return -1; return G.seats.findIndex(x=>x.id===(offline?'local':PID)); }
async function doAction(fn,{retry=false,keepUi=false}={}){
  if(busy) return; busy=true;
  try{
    for(let attempt=0;attempt<5;attempt++){
      const s=clone(G);
      try{ fn(s); }catch(e){ toast(e.message); return false; }
      if(!keepUi) ui={from:null,to:null,sel:new Set()};
      if(await commit(s)) return true;
      await refetch();
      if(!retry){ toast('遊戲狀態剛更新，請再操作一次'); return false; }
    }
    toast('太多人同時操作，再試一次');
    return false;
  } finally { busy=false; if(G&&mode==='game') renderGame(); }
}

/* ---- bots (run by host) ---- */
function maybeBot(){
  if(!G||G.status!=='playing') return;
  if(!(offline||G.host===PID)) return;
  const seat=botActor(G); if(seat<0) return;
  const key=G.ver+':'+seat; if(botKey===key) return; botKey=key;
  clearTimeout(botTimer);
  const ph=G.phase;
  const delay=ph==='refill'?600+Math.random()*900:ph==='draw'||ph==='draw2'?650:ph==='defend'?900:1200;
  botTimer=setTimeout(async()=>{
    if(!G||G.status!=='playing'||G.ver+':'+botActor(G)!==key) return;
    const s=clone(G); try{ runBot(s,seat); }catch(e){ console.error(e); return; }
    const ok=await commit(s);
    if(!ok){ await refetch(); botKey=null; maybeBot(); }
  },delay);
}

function measure(){ const r=$('mapwrap').getBoundingClientRect(); if(r.width>0&&r.height>0) aspect=r.height/r.width; fitW=aspect>0.565?1000:565/aspect; }
function applyVB(){

  }
  if(s.turn!==me){
    const verb=s.phase==='draw'?'抽牌':s.phase==='draw2'?'抽 2 張牌':'行動';
    st.innerHTML=`等待 <b>${N(s.turn)}</b> ${verb}${s.seats[s.turn].bot?'（電腦思考中…）':''}`; return;
  }
  if(s.phase==='draw'){ st.innerHTML='<b>你的回合！</b>先點左邊的牌堆抽 1 張牌。'; return; }
  if(s.phase==='draw2'){ st.innerHTML=`點牌堆再抽 <b>${s.pending}</b> 張。`; return; }
  const hand=s.hands[me], sel=[...ui.sel];
  let msg='';
  if(ui.from&&ui.to) msg=`⚔️ ${nm(ui.from)}（${R[ui.from].v}）→ ${nm(ui.to)}（${R[ui.to].v}）：選手牌當援軍，總和 <b>${R[ui.from].v+selSum(me)}</b>`;
  else if(ui.from) msg=`已選 ${nm(ui.from)}，再點相鄰的對手地區（黃色虛線）。`;
  else msg='<b>選擇行動：</b>選 1 張「可打出」的牌佔領、點地圖上你的地區進攻，或抽 2 張。';
  st.innerHTML=msg;
  btn('抽 2 張',()=>doAction(x=>actDraw2(x,me)),'ghost');
  const one=sel.length===1?hand[sel[0]]:null, canPlay=one&&s.owned[one]===undefined;
  btn(canPlay?`打出「${nm(one)}」`:'打出地區',()=>doAction(x=>actPlay(x,me,sel[0])),'',!canPlay);
  btn(ui.from&&ui.to?`⚔️ 進攻（${sel.length} 張）`:'⚔️ 進攻',()=>doAction(x=>actAttack(x,me,ui.from,ui.to,sel)),'danger',!(ui.from&&ui.to));
  if(ui.sel.size||ui.from) btn('清除',()=>{ui={from:null,to:null,sel:new Set()};renderGame();},'ghost');
}
function openModal(html){$('modal').innerHTML=html;$('overlay').classList.remove('hidden');}
function closeModal(){$('overlay').classList.add('hidden');}
$('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
function showBattle(b){
  const s=G, N=i=>escapeHtml(s.seats[i].name), mini=a=>a.length?a.map(c=>`<span class="mini">${R[c].name} ${R[c].v}</span>`).join(''):'<span class="mini">無援軍</span>';
  openModal(`<h2>${b.win?'🏴 進攻成功！':'🛡️ 防守成功！'}</h2>
  <div class="bt"><div class="side2"><div>${N(b.attacker)}</div><div class="note">${nm(b.from)}（${R[b.from].v}）</div><div class="tot">${b.atk}</div><div class="minis">${mini(b.atkCards)}</div></div>
  <div style="font-size:20px">VS</div>
  <div class="side2"><div>${N(b.defender)}</div><div class="note">${nm(b.to)}（${R[b.to].v}）</div><div class="tot">${b.def}</div><div class="minis">${mini(b.defCards)}</div></div></div>
  <div class="note">${b.win?`${N(b.attacker)} 奪下了 ${nm(b.to)}。`:`${nm(b.to)} 守住了。`}接下來進攻方可抽 ${b.atkDraw} 張、防守方可抽 ${b.defDraw} 張，<b>點牌堆搶牌！</b></div>
  <div class="row" style="justify-content:flex-end"><button onclick="closeModal()">去搶牌！</button></div>`);
}
function showEnd(force){
  const s=G; if(!s||!s.result) return;
  if(force!==true&&endShownVer===s.ver) return;
  endShownVer=s.ver;
  const rows=s.result.scores.slice().sort((a,b)=>b.score-a.score).map(x=>{const p=s.seats[x.seat];
    return `<div class="score-row"><span class="dot" style="background:${p.color}"></span><span>${s.result.winners.includes(x.seat)?'👑 ':''}${escapeHtml(p.name)}</span><span class="note" style="font-size:12px">領土 ${x.comp.length} ＋ 手牌 ${x.bonus}</span><span class="s">${x.score}</span></div>`;}).join('');
  openModal(`<h2>遊戲結束</h2>${rows}<div class="note">地圖上亮起的是每位玩家計分的那片領土。</div>
  <div class="row" style="justify-content:flex-end">${(offline||s.host===PID)?'<button class="ghost" onclick="closeModal();restart()">再來一局</button>':''}<button onclick="closeModal()">關閉</button></div>`);
}
async function restart(){
  const seats=G.seats.map(p=>({...p})); const s=newGame(seats);
  if(!offline){s.code=code;s.host=G.host;s.hostName=G.hostName;s.createdAt=G.createdAt;}
  seenBattle=null; endShownVer=null; await commit(s);
}
window.closeModal=closeModal; window.restart=restart;
init();
</script>
</body>
